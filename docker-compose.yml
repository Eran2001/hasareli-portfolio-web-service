services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8787
    volumes:
      - .:/app
      - web_modules:/app/node_modules
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      WEB_ORIGIN: http://localhost:5173
      PORT: 8787

volumes:
  web_modules:
